<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/story.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
</head>
<body>
  <div id="story"></div>
  <script type="module">
    import { renderStory } from './js/render.js';
    import { getLocalStory } from './js/store.js';

    const root = document.getElementById('story');
    const params = new URLSearchParams(location.search);
    let destroy = null;
    const show = (story) => { destroy?.(); destroy = renderStory(story, root); };
    const fail = (msg) => { root.innerHTML = `<p class="sm-narrow" style="padding-top:120px">${msg}</p>`; };

    if (params.has('preview')) {
      // Builder preview: receive story JSON from the parent window.
      addEventListener('message', (e) => {
        if (e.origin !== location.origin || e.data?.type !== 'story') return;
        const y = scrollY;
        show(e.data.story);
        scrollTo(0, Math.min(y, document.documentElement.scrollHeight));
      });
      parent.postMessage({ type: 'preview-ready' }, location.origin);
    } else if (params.get('local')) {
      const story = getLocalStory(params.get('local'));
      story ? show(story) : fail('Story not found in this browser.');
    } else {
      const src = params.get('story') || 'stories/potomac.json';
      if (!/^stories\/[\w-]+\.json$/.test(src)) fail('Invalid story path.');
      else fetch(src).then((r) => r.ok ? r.json() : Promise.reject(r.status)).then(show).catch(() => fail('Could not load story.'));
    }
  </script>
</body>
</html>
