<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Reset password · Waymark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="auth-card" id="card">
    <h1>Forgot your password?</h1>
    <p>Enter your email and we'll send you a link to choose a new one.</p>
    <form id="forgot-form" novalidate>
      <label class="field"><span class="field-label">Email</span><input type="email" name="email" autocomplete="email" required></label>
      <p class="form-error" id="err" role="alert"></p>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Send reset link</button>
    </form>
    <div id="sent" hidden>
      <div class="notice" role="status"></div>
      <p class="field-hint" style="margin-top:14px">Hosting this yourself without email set up? The link is printed in the terminal where the server is running.</p>
    </div>
    <p class="auth-foot"><a class="link-btn" href="/login.html">Back to sign in</a></p>
  </div>
  <script type="module" src="/js/forgot.js"></script>
</body>
</html>
