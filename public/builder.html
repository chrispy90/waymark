<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Editor · Waymark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Source+Serif+4:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/css/map.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@turf/turf@7.1.0/turf.min.js"></script>
</head>
<body>
  <div class="bld">
    <header class="bld-top">
      <a href="/" class="icon-btn" data-icon="back" title="All stories" aria-label="All stories"></a>
      <span id="logo-slot"></span>
      <span class="bld-sep" aria-hidden="true"></span>
      <input id="title-input" class="bld-title" aria-label="Story title" placeholder="Untitled story" autocomplete="off">
      <span id="save-state" class="save-state" aria-live="polite"></span>
      <span class="bld-sep" aria-hidden="true"></span>
      <button type="button" id="btn-undo" class="icon-btn" data-icon="undo" title="Undo" aria-label="Undo" disabled></button>
      <button type="button" id="btn-redo" class="icon-btn" data-icon="redo" title="Redo" aria-label="Redo" disabled></button>
      <span class="spacer"></span>
      <button type="button" id="btn-cmd" class="cmd-btn" data-icon="search"><span>Search commands</span><kbd id="cmd-kbd">Ctrl K</kbd></button>
      <div class="seg" id="device" role="group" aria-label="Preview size">
        <button type="button" data-device="desktop" class="is-on" data-icon="monitor" title="Desktop preview" aria-label="Desktop preview"></button>
        <button type="button" data-device="phone" data-icon="phone" title="Phone preview" aria-label="Phone preview"></button>
      </div>
      <button type="button" id="btn-more" class="icon-btn" data-icon="more" title="More" aria-label="More options"></button>
      <button type="button" id="btn-preview" class="btn" data-icon="eye">Preview</button>
      <button type="button" id="btn-publish" class="btn btn-primary publish-btn">Publish</button>
    </header>
    <div class="bld-main">
      <aside class="rail">
        <div class="rail-tabs">
          <div class="seg seg-block" id="tabs" role="tablist">
            <button type="button" role="tab" data-tab="content" class="is-on" data-icon="text">Content</button>
            <button type="button" role="tab" data-tab="story" data-icon="sliders">Story</button>
            <button type="button" role="tab" data-tab="data" data-icon="layers">Data</button>
          </div>
        </div>
        <div class="rail-body" id="rail"></div>
      </aside>
      <section class="stage" id="stage">
        <div class="stage-bar"><span class="stage-hint" data-icon="target">Click anything in the preview to edit it</span></div>
        <div class="stage-frame"><iframe id="preview" src="/viewer.html?preview=1" title="Live preview"></iframe></div>
      </section>
    </div>
  </div>
  <script type="module" src="/js/builder.js"></script>
</body>
</html>
