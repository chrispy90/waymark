<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/css/map.css">
  <link rel="stylesheet" href="/css/builder.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
</head>
<body>
  <header class="b-top">
    <a href="/" class="b-home" aria-label="Your stories" title="Your stories">◧</a>
    <input id="title-input" class="b-title" aria-label="Story title" placeholder="Story title">
    <span id="status" class="b-muted" aria-live="polite"></span>
    <nav class="b-actions">
      <button id="btn-import" class="b-btn" type="button" title="Create a new story from a JSON file">Import</button>
      <button id="btn-export" class="b-btn" type="button">Export JSON</button>
      <button id="btn-view" class="b-btn" type="button">Preview draft ↗</button>
      <button id="btn-publish" class="b-btn is-primary" type="button">Publish…</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
    </nav>
  </header>
  <div class="b-layout">
    <aside id="editor" class="b-editor">
      <details class="b-section">
        <summary>Story settings</summary>
        <div id="settings"></div>
      </details>
      <details class="b-section" open>
        <summary>Data layers</summary>
        <div id="layers"></div>
      </details>
      <h2 class="b-h">Blocks</h2>
      <div id="blocks"></div>
    </aside>
    <section class="b-preview">
      <iframe id="preview" src="/viewer.html?preview=1" title="Story preview"></iframe>
    </section>
  </div>
  <dialog id="picker" class="b-dialog"></dialog>
  <script type="module" src="/js/builder.js"></script>
</body>
</html>
