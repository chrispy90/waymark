<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="referrer" content="no-referrer">
  <title>Choose a new password · Waymark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="auth-card" id="card">
    <h1>Choose a new password</h1>
    <p>You'll be signed out on every other device.</p>
    <form id="reset-form" novalidate hidden>
      <input type="text" name="username" autocomplete="username" hidden>
      <label class="field"><span class="field-label">New password</span><input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
      <label class="field"><span class="field-label">Type it again</span><input type="password" name="confirm" autocomplete="new-password" minlength="8" required></label>
      <p class="field-hint">At least 8 characters.</p>
      <p class="form-error" id="err" role="alert"></p>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Set password</button>
    </form>
    <div id="invalid" hidden>
      <p class="form-error" style="font-size:14px">This link is invalid, expired, or was already used.</p>
      <a class="btn btn-primary btn-lg btn-block" href="/forgot.html" style="margin-top:16px">Request a new link</a>
    </div>
  </div>
  <script type="module" src="/js/reset.js"></script>
</body>
</html>
